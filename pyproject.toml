[project]
name = "miraveja-studiolink"
version = "1.0.0"
description = "Contract library for the MiraVeja Studio Link: message models, a Studio-side client, a reference Museum stand-in, and a conformance suite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "starlette>=0.37",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.scripts]
miraveja-studiolink = "miraveja_studiolink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miraveja_studiolink"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.18",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
